    name: Python-CI

    on:
      push:
      pull_request:

    permissions:
      contents: read

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    jobs:
      lint:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: astral-sh/setup-uv@v6
            with:
              python-version: "3.12"
              enable-cache: true
          - run: uv sync --dev
          - run: uv run ruff check .
          - run: uv run ruff format --check .
          - run: uv run mypy nonebot_plugin_weather_fighter

      test:
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        steps:
          - uses: actions/checkout@v4
          - uses: astral-sh/setup-uv@v6
            with:
              python-version: ${{ matrix.python-version }}
              enable-cache: true
          - run: uv sync --dev
          - run: uv run pytest

      build:
        needs: [lint, test]
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: astral-sh/setup-uv@v6
            with:
              python-version: "3.12"
              enable-cache: true
          - run: uv sync --dev
          - run: uv build
