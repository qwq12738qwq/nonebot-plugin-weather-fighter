[project]
name = "nonebot-plugin-weather-fighter"
version = "0.8.6"
description = "老实看天气,很枯燥吧"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "weather-fighter contributors" }]
keywords = ["nonebot", "nonebot2", "qq", "weather", "game", "kline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "nonebot2[fastapi]>=2.1.0",
  "nonebot-adapter-onebot>=2.1.0",
  "nonebot-plugin-htmlrender[playwright]>=0.6.0",
  "nonebot-plugin-localstore>=0.5.0",
  "httpx>=0.20",
  "jinja2>=2.1",
  "aiosqlite>=0.10",
  "chinesecalendar>=0.90",
]

[dependency-groups]
dev = [
  "nonebug>=0.4.4",
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "fonttools[woff]>=4.65.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_weather_fighter"]

[tool.nonebot]
plugins = ["nonebot_plugin_weather_fighter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"nonebot_plugin_weather_fighter/matcher.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
files = ["nonebot_plugin_weather_fighter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
